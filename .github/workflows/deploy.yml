name: Deploy StoryCinema

on:
  push:
    branches: [main, "arena/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Artifact for manual download / external host
      - uses: actions/upload-artifact@v4
        with:
          name: storycinema-next-build
          path: |
            .next
            public
            package.json
            package-lock.json
            next.config.ts
          retention-days: 14
